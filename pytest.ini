[pytest]
minversion = 6.0
addopts = -v --strict-markers
testpaths = 
    tests_assignment
markers =
    unit: Mark a test as a function-level unit test
    boundary: Mark a test as a boundary value analysis (BVA) or ECP test
    module_a: Tests associated with Module A (Stack - Partner)
    module_b: Tests associated with Module B (Prime Check - Danish)
    module_c: Tests associated with Module C (Binary Search - Danish)
    order: Mark to control test execution sequence